services:
  mongodb:
    image: mongo:7.0
    container_name: eago-refimpl-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - eago_refimpl_mongodb_data:/data/db
    networks:
      - eago-refimpl-network

  mongo-express:
    image: mongo-express:latest
    container_name: eago-refimpl-mongo-express
    ports:
      - "8888:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
    networks:
      - eago-refimpl-network

volumes:
  eago_refimpl_mongodb_data:

networks:
  eago-refimpl-network:
    driver: bridge

server:
  host: "127.0.0.1"
  port: 9006

metadata:
  name: "eago-communication-agent"
  version: "0.1.0"
  description: "OpenEAGO Phase 6 (Communication & Delivery) reference agent"
  spec_version: "0.1.0"
  eago_phases:
    - communication_delivery
  capabilities:
    - communication_delivery
  tags:
    - "open-eago"
    - "reference-implementation"
    - "communication"

agent:
  instance_id: "communication-agent-1"
  capability_codes:
    - communication_delivery
  version: "0.1.0"
  jurisdiction: "GLOBAL"
  data_center: "local-dev"
  compliance: ["SOC2"]
  reliability: 0.99
  health_status: "healthy"
  uptime_percentage: 99.9

mcp:
  protocol_version: "2024-11-05"
  eago_envelope: true

spire:
  enabled: false

bootstrap:
  urls:
    - "http://127.0.0.1:8443"
  sync_interval: 20
  status_interval: 10

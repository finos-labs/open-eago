server:
  host: "127.0.0.1"
  port: 9002

metadata:
  name: "eago-planning-agent"
  version: "0.1.0"
  description: "OpenEAGO Phase 2 (Planning & Negotiation) reference agent"
  spec_version: "0.1.0"
  eago_phases:
    - planning_negotiation
  capabilities:
    - planning_negotiation
  tags:
    - "open-eago"
    - "reference-implementation"
    - "planning"

agent:
  instance_id: "planning-agent-1"
  capability_codes:
    - planning_negotiation
  version: "0.1.0"
  jurisdiction: "GLOBAL"
  data_center: "local-dev"
  compliance: ["SOC2"]
  reliability: 0.98
  health_status: "healthy"
  uptime_percentage: 99.5

mcp:
  protocol_version: "2024-11-05"
  eago_envelope: true

spire:
  enabled: false

bootstrap:
  urls:
    - "http://127.0.0.1:8443"
  sync_interval: 20
  status_interval: 10

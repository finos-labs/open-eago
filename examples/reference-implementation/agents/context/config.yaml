server:
  host: "127.0.0.1"
  port: 9005

metadata:
  name: "eago-context-agent"
  version: "0.1.0"
  description: "OpenEAGO Phase 5 (Context & State Management) reference agent"
  spec_version: "0.1.0"
  eago_phases:
    - context_state_management
  capabilities:
    - context_state_management
  tags:
    - "open-eago"
    - "reference-implementation"
    - "context"

agent:
  instance_id: "context-agent-1"
  capability_codes:
    - context_state_management
  version: "0.1.0"
  jurisdiction: "GLOBAL"
  data_center: "local-dev"
  compliance: ["SOC2"]
  reliability: 0.99
  health_status: "healthy"
  uptime_percentage: 99.8

mcp:
  protocol_version: "2024-11-05"
  eago_envelope: true

spire:
  enabled: false

bootstrap:
  urls:
    - "http://127.0.0.1:8443"
  sync_interval: 20
  status_interval: 10
